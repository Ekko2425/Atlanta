<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Creá tu cuenta de la comunidad Atlanta DayZ.">
  <title>Mi cuenta | Atlanta DayZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; padding:32px 16px; display:grid; place-items:center; color:#f4f4f4; font-family:Roboto,Arial,sans-serif; background:linear-gradient(#10151bd9,#10151bf2),url("fondo.jpg") center/cover fixed; }
    .panel { width:min(100%,460px); padding:30px; border:1px solid #ffffff25; border-radius:16px; background:#171d25f2; box-shadow:0 18px 60px #0009; }
    .brand { text-align:center; margin-bottom:22px; }
    .brand h1 { margin:0 0 8px; font-size:28px; }
    .brand p { margin:0; color:#b8c0ca; }
    .tabs { display:flex; gap:8px; margin:22px 0; }
    .tabs button { flex:1; padding:11px; color:#dce2e9; border:1px solid #3a4654; border-radius:8px; background:#222b36; cursor:pointer; font-weight:700; }
    .tabs button.active { background:#5865f2; border-color:#5865f2; color:white; }
    label { display:block; margin:14px 0 6px; font-weight:700; font-size:14px; }
    input { width:100%; padding:12px 13px; border:1px solid #46515e; border-radius:8px; color:white; background:#0f141a; font:inherit; }
    input:focus { outline:2px solid #7d87ff; border-color:transparent; }
    .hint { color:#aeb8c4; font-size:12px; margin:6px 0 0; }
    .primary { width:100%; margin-top:20px; padding:13px; border:0; border-radius:8px; color:white; background:#5865f2; font-weight:900; font-size:15px; cursor:pointer; }
    .primary:disabled { opacity:.6; cursor:wait; }
    .secondary { display:block; width:100%; margin-top:12px; padding:10px; border:0; color:#c7ceff; background:transparent; cursor:pointer; }
    .message { min-height:22px; margin:14px 0 0; color:#cbd5e1; font-size:14px; line-height:1.5; overflow-wrap:anywhere; }
    .message.error { color:#ff9696; } .message.success { color:#8ee0b2; }
    .profile { padding:16px; margin-top:16px; border-radius:10px; background:#222b36; }
    .profile strong { color:#9eabff; }
    .back { display:block; margin-top:22px; text-align:center; color:#c7ceff; text-decoration:none; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main class="panel">
    <header class="brand"><h1>ATLANTA DAYZ</h1><p>Tu cuenta de la comunidad</p></header>
    <section id="auth-view">
      <div class="tabs" role="tablist" aria-label="Acceso">
        <button id="login-tab" class="active" type="button">Iniciar sesión</button>
        <button id="signup-tab" type="button">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <div id="username-wrap" hidden>
          <label for="username">Nombre de jugador</label>
          <input id="username" name="username" type="text" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" autocomplete="nickname" placeholder="Ej: Survivor_23">
          <p class="hint">3 a 20 caracteres: letras, números o guion bajo.</p>
        </div>
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="tu@email.com">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="Mínimo 8 caracteres">
        <button id="submit-btn" class="primary" type="submit">Iniciar sesión</button>
      </form>
      <button id="reset-btn" class="secondary" type="button">Olvidé mi contraseña</button>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>
    <section id="account-view" hidden>
      <h2>¡Bienvenido/a!</h2>
      <p>Sesión iniciada en la comunidad Atlanta.</p>
      <div class="profile"><div>Jugador: <strong id="profile-name">—</strong></div><div style="margin-top:8px">Correo: <span id="profile-email">—</span></div></div>
      <button id="logout-btn" class="primary" type="button">Cerrar sesión</button>
      <p id="account-message" class="message" role="status" aria-live="polite"></p>
    </section>
    <a class="back" href="index.html">← Volver al sitio principal</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    (() => {
      const config = window.ATLANTA_SUPABASE_CONFIG || {};
      const configured = config.url && config.anonKey &&
        !config.url.includes("TU-PROYECTO") && !config.anonKey.includes("TU_CLAVE");
      const authView = document.getElementById("auth-view");
      const accountView = document.getElementById("account-view");
      const form = document.getElementById("auth-form");
      const message = document.getElementById("message");
      const submit = document.getElementById("submit-btn");
      const usernameWrap = document.getElementById("username-wrap");
      const password = document.getElementById("password");
      let mode = "login";
      let client = null;

      function say(text, type = "") {
        message.textContent = text;
        message.className = "message " + type;
      }
      function setMode(next) {
        mode = next;
        const signup = mode === "signup";
        document.getElementById("login-tab").classList.toggle("active", !signup);
        document.getElementById("signup-tab").classList.toggle("active", signup);
        usernameWrap.hidden = !signup;
        document.getElementById("username").required = signup;
        password.autocomplete = signup ? "new-password" : "current-password";
        submit.textContent = signup ? "Crear cuenta" : "Iniciar sesión";
        document.getElementById("reset-btn").hidden = signup;
        say("");
      }
      document.getElementById("login-tab").addEventListener("click", () => setMode("login"));
      document.getElementById("signup-tab").addEventListener("click", () => setMode("signup"));

      function showAccount(user) {
        authView.hidden = true;
        accountView.hidden = false;
        document.getElementById("profile-email").textContent = user.email || "—";
        document.getElementById("profile-name").textContent =
          user.user_metadata?.username || user.email?.split("@")[0] || "Jugador";
      }
      function showAuth() {
        accountView.hidden = true;
        authView.hidden = false;
      }
      async function refreshSession() {
        const { data, error } = await client.auth.getSession();
        if (error) throw error;
        if (data.session) showAccount(data.session.user);
        else showAuth();
      }

      if (!configured || !window.supabase?.createClient) {
        say("La página está lista, pero falta conectar Supabase. Seguí los pasos de CONFIGURAR-CUENTAS.md.", "error");
        submit.disabled = true;
        document.getElementById("reset-btn").disabled = true;
        return;
      }
      client = window.supabase.createClient(config.url, config.anonKey);
      refreshSession().catch(error => say(error.message, "error"));
      client.auth.onAuthStateChange((_event, session) => {
        if (session) showAccount(session.user);
        else showAuth();
      });

      form.addEventListener("submit", async event => {
        event.preventDefault();
        const email = document.getElementById("email").value.trim();
        const pass = password.value;
        submit.disabled = true;
        say(mode === "signup" ? "Creando tu cuenta…" : "Ingresando…");
        try {
          let result;
          if (mode === "signup") {
            const username = document.getElementById("username").value.trim();
            if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) throw new Error("El nombre debe tener entre 3 y 20 caracteres (letras, números o _).");
            if (pass.length < 8) throw new Error("La contraseña debe tener al menos 8 caracteres.");
            result = await client.auth.signUp({ email, password: pass, options: { data: { username }, emailRedirectTo: new URL("./cuenta.html", window.location.href).href } });
            if (result.error) throw result.error;
            if (!result.data.session) say("¡Registro recibido! Revisá tu correo y confirmá la dirección para activar tu cuenta.", "success");
            else say("¡Cuenta creada! Ya podés participar de la comunidad.", "success");
            form.reset();
          } else {
            result = await client.auth.signInWithPassword({ email, password: pass });
            if (result.error) throw result.error;
            say("Sesión iniciada correctamente.", "success");
            showAccount(result.data.user);
          }
        } catch (error) {
          say(error.message || "No se pudo completar la operación. Intentá nuevamente.", "error");
        } finally {
          submit.disabled = false;
        }
      });

      document.getElementById("reset-btn").addEventListener("click", async () => {
        const email = document.getElementById("email").value.trim();
        if (!email) return say("Escribí tu correo electrónico para enviarte el enlace de recuperación.", "error");
        try {
          const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + "/cuenta.html" });
          if (error) throw error;
          say("Si el correo está registrado, recibirás un enlace para restablecer tu contraseña.", "success");
        } catch (error) { say(error.message, "error"); }
      });
      document.getElementById("logout-btn").addEventListener("click", async () => {
        const { error } = await client.auth.signOut();
        const status = document.getElementById("account-message");
        status.textContent = error ? error.message : "Cerraste sesión.";
        if (error) status.classList.add("error");
        else showAuth();
      });
    })();
  </script>
</body>
</html>
