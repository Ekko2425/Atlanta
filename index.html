<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlanta DayZ Server</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: #1e1e1e;
      padding: 30px;
      border-radius: 10px;
      border: 1px solid #333;
    }
    h1 { color: #e63946; font-size: 2.5em; margin-bottom: 10px; }
    .ip-box {
      background: #2b2b2b;
      padding: 15px;
      border-radius: 6px;
      font-size: 1.2em;
      font-weight: bold;
      margin: 20px 0;
    }
    .btn {
      display: inline-block;
      background: #5865F2;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 10px;
    }
    ul { text-align: left; max-width: 450px; margin: 20px auto; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ATLANTA DAYZ</h1>
    <p>Supervivencia, PvP y acción sin límites.</p>
    
    <div class="ip-box">
      IP: 123.456.78.90:2302
    </div>

    <h3>Reglas Básicas</h3>
    <ul>
      <li>Respetar a todos los jugadores y al staff.</li>
      <li>Prohibido el uso de cheats, exploits o duplicación.</li>
      <li>Horarios de raideo: Sábados y Domingos.</li>
    </ul>

    <a href="https://discord.com" class="btn" target="_blank">Unirse al Discord</a>
  </div>
</body>
</html>
