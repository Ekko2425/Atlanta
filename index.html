<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlanta DayZ Server</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f1115;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: #1a1d24;
      padding: 35px;
      border-radius: 12px;
      border: 1px solid #2e333d;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    h1 { color: #e63946; font-size: 2.6em; margin-bottom: 5px; letter-spacing: 2px; }
    .subtitle { color: #a0aab5; margin-bottom: 25px; font-size: 1.1em; }
    .ip-box {
      background: #252932;
      padding: 15px 20px;
      border-radius: 8px;
      font-size: 1.2em;
      font-weight: bold;
      margin: 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 450px;
      border: 1px solid #383e4a;
    }
    .copy-btn {
      background: #e63946;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9em;
      transition: background 0.2s;
    }
    .copy-btn:hover { background: #c92a37; }
    .discord-btn {
      display: inline-block;
      background: #5865F2;
      color: white;
      padding: 14px 28px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.1em;
      margin-top: 20px;
      transition: background 0.2s;
    }
    .discord-btn:hover { background: #4752c4; }
    h3 { margin-top: 30px; color: #f1faee; }
    ul { text-align: left; max-width: 450px; margin: 15px auto; line-height: 1.8; color: #d1d5db; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ATLANTA DAYZ</h1>
    <p class="subtitle">Supervivencia, PvP y acción sin límites.</p>
    
    <div class="ip-box">
      <span id="server-ip">103.106.58.5:7076</span>
      <button class="copy-btn" onclick="copiarIP()" id="btn-copiar">Copiar IP</button>
    </div>

    <h3>Reglas Básicas</h3>
    <ul>
      <li>Respetar a todos los jugadores y al staff.</li>
      <li>Prohibido el uso de cheats, exploits o duplicación.</li>
      <li>Horarios de raideo: Sábados y Domingos.</li>
    </ul>

    <a href="https://discord.gg/ygUDDkqAFD" class="discord-btn" target="_blank">Unirse al Discord</a>
  </div>

  <script>
    function copiarIP() {
      const ip = "103.106.58.5:7076";
      navigator.clipboard.writeText(ip).then(() => {
        const btn = document.getElementById("btn-copiar");
        btn.innerText = "¡Copiada!";
        btn.style.background = "#2a9d8f";
        setTimeout(() => {
          btn.innerText = "Copiar IP";
          btn.style.background = "#e63946";
        }, 2000);
      });
    }
  </script>
</body>
</html>
