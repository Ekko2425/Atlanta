name: Atlanta DayZ ADM reader

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlanta-dayz-adm-reader
  cancel-in-progress: false

jobs:
  read-adm:
    # Activar manualmente con la variable de repositorio DAYZ_INGEST_ENABLED=true
    # después de cargar y verificar todos los secretos requeridos.
    if: ${{ vars.DAYZ_INGEST_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencia SFTP
        run: python -m pip install --disable-pip-version-check paramiko==3.5.1

      - name: Leer archivos ADM
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DAYZ_SFTP_HOST: ${{ secrets.DAYZ_SFTP_HOST }}
          DAYZ_SFTP_PORT: ${{ secrets.DAYZ_SFTP_PORT }}
          DAYZ_SFTP_USERNAME: ${{ secrets.DAYZ_SFTP_USERNAME }}
          DAYZ_SFTP_PASSWORD: ${{ secrets.DAYZ_SFTP_PASSWORD }}
          DAYZ_SFTP_PROFILES_PATH: ${{ secrets.DAYZ_SFTP_PROFILES_PATH }}
          DAYZ_SFTP_HOST_KEY_SHA256: ${{ secrets.DAYZ_SFTP_HOST_KEY_SHA256 }}
          DAYZ_INITIAL_SCAN: tail
        run: python dayz-reader.py
