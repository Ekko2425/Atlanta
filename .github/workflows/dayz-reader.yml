name: Atlanta DayZ ADM reader

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlanta-dayz-adm-reader
  cancel-in-progress: false

jobs:
  read-adm:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Diagnosticar activación automática
        run: |
          if [ "${{ vars.DAYZ_INGEST_ENABLED }}" = "true" ]; then
            echo "DAYZ_INGEST_ENABLED está disponible y vale true."
          else
            echo "DAYZ_INGEST_ENABLED no está disponible como true."
          fi
          echo "Evento que inició esta ejecución: ${{ github.event_name }}"

      - name: Descargar repositorio
        if: ${{ vars.DAYZ_INGEST_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4

      - name: Preparar Python
        if: ${{ vars.DAYZ_INGEST_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencia SFTP
        if: ${{ vars.DAYZ_INGEST_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
        run: python -m pip install --disable-pip-version-check paramiko==3.5.1

      - name: Leer archivos ADM
        if: ${{ vars.DAYZ_INGEST_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DAYZ_SFTP_HOST: ${{ secrets.DAYZ_SFTP_HOST }}
          DAYZ_SFTP_PORT: ${{ secrets.DAYZ_SFTP_PORT }}
          DAYZ_SFTP_USERNAME: ${{ secrets.DAYZ_SFTP_USERNAME }}
          DAYZ_SFTP_PASSWORD: ${{ secrets.DAYZ_SFTP_PASSWORD }}
          DAYZ_SFTP_PROFILES_PATH: ${{ secrets.DAYZ_SFTP_PROFILES_PATH }}
          DAYZ_SFTP_HOST_KEY_SHA256: ${{ secrets.DAYZ_SFTP_HOST_KEY_SHA256 }}
          DAYZ_INITIAL_SCAN: ${{ github.event_name == 'workflow_dispatch' && 'from_start' || 'tail' }}
        run: python dayz-reader.py
