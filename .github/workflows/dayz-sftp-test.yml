name: Atlanta DayZ SFTP connection test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sftp-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check paramiko==3.5.1

      - name: Read a small ADM sample without sending data
        env:
          DAYZ_SFTP_HOST: ${{ secrets.DAYZ_SFTP_HOST }}
          DAYZ_SFTP_PORT: ${{ secrets.DAYZ_SFTP_PORT }}
          DAYZ_SFTP_USERNAME: ${{ secrets.DAYZ_SFTP_USERNAME }}
          DAYZ_SFTP_PASSWORD: ${{ secrets.DAYZ_SFTP_PASSWORD }}
          DAYZ_SFTP_PROFILES_PATH: ${{ secrets.DAYZ_SFTP_PROFILES_PATH }}
          DAYZ_SFTP_HOST_KEY_SHA256: ${{ secrets.DAYZ_SFTP_HOST_KEY_SHA256 }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import importlib.util
          import os
          import posixpath
          import re
          import sys
          from collections import Counter
          import paramiko

          required = [
              "DAYZ_SFTP_HOST", "DAYZ_SFTP_PORT", "DAYZ_SFTP_USERNAME",
              "DAYZ_SFTP_PASSWORD", "DAYZ_SFTP_PROFILES_PATH",
              "DAYZ_SFTP_HOST_KEY_SHA256",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print("Faltan secretos requeridos: " + ", ".join(missing))
              sys.exit(1)

          spec = importlib.util.spec_from_file_location("dayz_reader", "dayz-reader.py")
          reader = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(reader)

          expected = os.environ["DAYZ_SFTP_HOST_KEY_SHA256"].removeprefix("SHA256:")
          class PinPolicy(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self, client, hostname, key):
                  actual = base64.b64encode(
                      hashlib.sha256(key.asbytes()).digest()
                  ).decode("ascii").rstrip("=")
                  if actual != expected.rstrip("="):
                      raise paramiko.SSHException("La huella SSH no coincide.")
                  print("Huella configurada coincide.")

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(PinPolicy())
          try:
              client.connect(
                  hostname=os.environ["DAYZ_SFTP_HOST"],
                  port=int(os.environ["DAYZ_SFTP_PORT"]),
                  username=os.environ["DAYZ_SFTP_USERNAME"],
                  password=os.environ["DAYZ_SFTP_PASSWORD"],
                  timeout=15, banner_timeout=15, auth_timeout=15,
                  look_for_keys=False, allow_agent=False,
              )
              sftp = client.open_sftp()
              try:
                  profiles = os.environ["DAYZ_SFTP_PROFILES_PATH"].rstrip("/")
                  files = [
                      item for item in sftp.listdir_attr(profiles)
                      if item.filename.endswith(".ADM")
                      and reader.FILE_DATE_RE.match(item.filename)
                  ]
                  if not files:
                      print("No se encontró un ADM con el formato esperado.")
                      sys.exit(1)

                  latest = sorted(files, key=lambda item: item.filename)[-1]
                  remote_path = posixpath.join(profiles, latest.filename)
                  sample_size = min(int(latest.st_size), 65536)
                  with sftp.open(remote_path, "rb") as remote:
                      remote.seek(max(0, int(latest.st_size) - sample_size))
                      raw = remote.read(sample_size)

                  lines = raw.splitlines(keepends=True)
                  complete_lines = [
                      line for line in lines
                      if line.endswith((b"\n", b"\r"))
                  ]
                  date_match = reader.FILE_DATE_RE.match(latest.filename)
                  counts = Counter()
                  chat_count = 0
                  chat_uids = set()
                  connected_lines = 0
                  connecting_lines = 0
                  connected_with_player = 0
                  connected_with_id = 0
                  connected_with_pos = 0
                  connected_strict_uid = 0
                  connecting_with_id = 0
                  id_length_counts = Counter()
                  parsed_connected_uid_count = 0
                  connected_uids = set()
                  connection_pattern = re.compile(
                      r'Player "([^"]+)"\s+\(id=(' + reader.UID + r')(?:\s+pos=<[^>]*>)?\)\s+is connected'
                  )
                  id_field_pattern = re.compile(r'\bid=([^\s)]+)')

                  for index, raw_line in enumerate(complete_lines):
                      line = raw_line.decode("utf-8", errors="replace").rstrip("\r\n")
                      chat = reader.CHAT_RE.search(line)
                      if chat:
                          chat_count += 1
                          chat_uids.add(chat.group(2))

                      body_match = reader.TIME_RE.match(line)
                      body = body_match.group(2) if body_match else ""
                      if " is connected" in body:
                          connected_lines += 1
                          if re.search(r'Player "([^"]+)"', body):
                              connected_with_player += 1
                          id_match = id_field_pattern.search(body)
                          if id_match:
                              connected_with_id += 1
                              id_length_counts[len(id_match.group(1))] += 1
                          if "pos=<" in body:
                              connected_with_pos += 1
                          strict_match = connection_pattern.search(body)
                          if strict_match:
                              connected_strict_uid += 1
                              connected_uids.add(strict_match.group(2))
                      elif " is connecting" in body:
                          connecting_lines += 1
                          id_match = id_field_pattern.search(body)
                          if id_match:
                              connecting_with_id += 1

                      event = reader.parse_event(
                          line, date_match.group(1), remote_path, index
                      )
                      if event:
                          counts[event["event_type"]] += 1
                          if event["event_type"] == "connected" and event.get("player_uid"):
                              parsed_connected_uid_count += 1

                  print("Lectura de muestra completada.")
                  print(f"Archivo analizado: {latest.filename}")
                  print(f"Bytes leídos: {len(raw)} (límite: 65536)")
                  print(f"Líneas completas analizadas: {len(complete_lines)}")
                  print(f"Eventos reconocidos por el parser: {sum(counts.values())}")
                  for event_type, count in sorted(counts.items()):
                      print(f"  {event_type}: {count}")
                  print(f"Mensajes de vinculación detectados: {chat_count}")
                  print(f"Líneas 'is connected': {connected_lines}")
                  print(f"Líneas 'is connecting' (no cuentan como ingreso): {connecting_lines}")
                  print(f"'is connected' con nombre de jugador: {connected_with_player}")
                  print(f"'is connected' con campo id=: {connected_with_id}")
                  print(f"'is connected' con pos=<: {connected_with_pos}")
                  print(f"'is connected' con BI UID de 44 caracteres en el patrón esperado: {connected_strict_uid}")
                  print(f"'is connecting' con campo id=: {connecting_with_id}")
                  print("Longitudes detectadas en campos id= (solo cantidades): " + str(dict(sorted(id_length_counts.items()))))
                  print(f"Eventos connected con player_uid asignado: {parsed_connected_uid_count}")
                  print(f"Coincidencias entre UID de chat y UID de conexión: {len(chat_uids & connected_uids)}")
                  print("No se imprimieron nombres, UID, mensajes ni líneas ADM.")
                  print("No se enviaron datos a Supabase ni se modificó ningún archivo.")
              finally:
                  sftp.close()
          except Exception as exc:
              print(f"Prueba de lectura fallida ({type(exc).__name__}).")
              sys.exit(1)
          finally:
              client.close()
          PY
